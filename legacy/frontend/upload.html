<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Marksheet | VeriTrust AI</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand"><span>VeriTrust</span> AI</div>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/upload">Upload</a>
          <a href="/result">Result</a>
          <a href="/details">Details</a>
        </nav>
      </header>

      <main class="page-shell">
        <section class="panel form-card">
          <div class="page-header">
            <h2>Upload Marksheet</h2>
          </div>

          <form id="upload-form" enctype="multipart/form-data">
            <label class="file-label" for="file-input">
              <strong>Choose PDF/Image</strong>
              <span id="file-status">Click to select your marksheet or result card</span>
            </label>
            <input id="file-input" type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.bmp,.txt" required />

            <div id="selected-file-box" class="status-box" style="display:none; margin-top:16px;">
              <strong>Selected file:</strong> <span id="selected-file-name">None</span>
            </div>

            <div class="button-row" style="margin-top:20px;">
              <button class="primary-btn" type="submit">Verify</button>
              <a class="ghost-btn" href="/">Back</a>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
